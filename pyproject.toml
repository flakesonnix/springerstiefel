[project]
name = "springerstiefel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "playwright>=1.63,<1.64",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1",
]
# Note: ruff comes from the nix flake (pip ruff binaries don't run on NixOS).
# Outside nix: pip install ruff

[project.scripts]
hey-capture = "springerstiefel.capture:main"
hey-proxy = "springerstiefel.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
springerstiefel = ["*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
